<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fair Warning: see what happens in a movie before you watch. Content warnings, a movie diary, and community logs.">
<meta name="theme-color" content="#0c0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3 L22 20 H2 Z' fill='none' stroke='%23ff5c4d' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='14.2' r='2.3' fill='%23ff5c4d'/%3E%3C/svg%3E">
<title>Fair Warning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a late-night video rental store. Marquee sign up top, tapes on shelves, warnings as stickers slapped on the box, a content-advisory panel on each tape's back. */
:root{
  --bg:#0e1320; --carpet:#121a2b; --shelf:#1a2236; --surface:#1d2639; --raise:#252f46; --line:#2e3a56;
  --ink:#f4ecda; --muted:#97a0b6; --dim:#6b7590;
  --red:#ff4d2d; --red-ink:#1b0904; --yellow:#ffd23f; --yellow-ink:#2a1e00; --green:#3fd896; --green-ink:#03251a; --blue:#5aa8ff;
  --paper:#f4ecda; --paper-ink:#1e1a14; --paper-line:#d6cbb2;
  --sign:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --px:"Silkscreen","Courier New",ui-monospace,monospace;
  --hard:3px 3px 0 #05070d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 100px;
  background-image:radial-gradient(rgba(90,168,255,.05) 1px,transparent 1.5px),radial-gradient(rgba(255,77,45,.04) 1px,transparent 1.5px);background-size:22px 22px,22px 22px;background-position:0 0,11px 11px}
.wrap{max-width:780px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* marquee */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:0 16px 12px;border-bottom:2px solid #070a12}
.marquee{position:relative;margin-top:12px;padding:12px 14px 10px;background:linear-gradient(180deg,#1a1020,#120c18);border:2px solid #070a12;box-shadow:var(--hard);display:flex;align-items:center;justify-content:space-between;gap:12px}
.marquee::before,.marquee::after{content:"";position:absolute;left:6px;right:6px;height:4px;background:radial-gradient(circle,#ffe9a0 1.4px,transparent 2px) 0 0/10px 4px repeat-x}
.marquee::before{top:3px}.marquee::after{bottom:3px}
.logo{font-family:var(--sign);font-size:28px;line-height:.9;color:var(--ink);letter-spacing:.01em;text-shadow:2px 2px 0 var(--red)}
.logo b{color:var(--yellow);font-weight:400;text-shadow:2px 2px 0 #7a1405}
.hours{font-family:var(--px);font-size:10px;line-height:1.5;color:var(--muted);text-align:right;text-transform:uppercase;letter-spacing:.05em}
.hours em{font-style:normal;color:var(--green)}
.search{margin-top:12px;display:flex;align-items:stretch;border:2px solid #070a12;box-shadow:var(--hard);background:#0a0d16}
.search label{font-family:var(--px);font-size:10px;letter-spacing:.08em;background:var(--yellow);color:var(--yellow-ink);display:flex;align-items:center;padding:0 10px;text-transform:uppercase}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 12px;font-family:var(--px);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.12)}
.search input::placeholder{color:#59627a}
.search input:focus{outline:none}.search:focus-within{outline:2px solid var(--yellow);outline-offset:2px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0a0d16;border-top:2px solid #05070d;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--px);font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
nav.tabs svg{width:22px;height:22px;image-rendering:pixelated}
nav.tabs svg rect{fill:currentColor}
nav.tabs button[aria-current="true"]{color:var(--yellow)}

/* type */
h2.sec{font-family:var(--sign);font-weight:400;font-size:20px;letter-spacing:.02em;margin:28px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.sub{color:var(--muted);font-size:14px;margin:-2px 0 12px;max-width:62ch}
.sub3{font-family:var(--px);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.note{background:var(--shelf);border:1px solid var(--line);padding:12px 14px;font-size:14px;color:var(--muted);margin-top:16px}
.date{font-family:var(--px);font-size:11px;color:var(--muted);letter-spacing:.04em}
.linkish{background:none;border:0;padding:0;color:var(--yellow);font-weight:700;font-size:14px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* aisle filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.chip{border:2px solid #070a12;background:var(--surface);padding:6px 11px;font-family:var(--px);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);box-shadow:2px 2px 0 #05070d}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.chip.small{padding:3px 8px;font-size:10px;box-shadow:none;border-width:1px;border-color:var(--line)}
.chip.small[aria-pressed="true"]{border-color:var(--yellow)}
.filters.genres{flex-wrap:nowrap;overflow-x:auto;margin-top:10px;padding-bottom:6px;scrollbar-width:thin}
.filters.genres .chip{flex-shrink:0;white-space:nowrap}
.count{font-family:var(--px);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 12px}

/* shelf of tapes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--ink)}
.poster{aspect-ratio:2/3;max-width:100%;width:100%;padding:9px 9px 10px 15px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:visible;background:#222436;box-shadow:4px 4px 0 #05070d;border:2px solid #05070d}
.poster .art{position:absolute;inset:0;overflow:hidden}.poster .art svg{width:100%;height:100%;display:block}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.poster::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,#05070d,#1a1d2a);z-index:1}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.78));pointer-events:none}
.poster .pt{font-family:var(--px);font-size:11px;font-weight:700;line-height:1.25;position:relative;z-index:2;word-break:break-word;text-shadow:2px 2px 0 #000;text-transform:uppercase}
.poster .py{font-family:var(--px);font-size:10px;font-weight:700;position:relative;z-index:2;align-self:flex-start;background:var(--yellow);color:var(--yellow-ink);padding:3px 5px 2px;border-radius:2px;transform:rotate(-4deg);box-shadow:1px 1px 0 #000}
.sticker{position:absolute;z-index:3;right:-6px;top:26px;max-width:88%;font-family:var(--px);font-weight:700;font-size:10px;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;padding:5px 7px 4px;transform:rotate(4deg);box-shadow:2px 2px 0 #000;border:1px solid rgba(0,0,0,.35)}
.sticker.warn{background:var(--red);color:var(--red-ink)}
.sticker.clear{background:var(--green);color:var(--green-ink)}
.sticker.part{background:#bfe9d4;color:var(--green-ink)}
.verdict.part{background:#bfe9d4;color:var(--green-ink)}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .meta .unrated{font-family:var(--px);font-size:9px;letter-spacing:.06em;border:1px dashed var(--dim);color:var(--dim);padding:1px 5px;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.card .poster{transition:transform .12s}.card:hover .poster,.card:focus-visible .poster{transform:translate(-2px,-3px)}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;font-family:var(--px);font-size:10px;letter-spacing:.04em;text-transform:uppercase;align-self:flex-start}
.badge.clear{background:var(--green);color:var(--green-ink)}
.badge.warn{background:var(--red);color:var(--red-ink)}
.badge.unk{border:1px dashed var(--dim);color:var(--muted)}

/* buttons */
.btn{border:2px solid #05070d;padding:10px 16px;font-family:var(--px);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:var(--red-ink);box-shadow:var(--hard)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #05070d}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.back{background:none;border:0;color:var(--muted);font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:16px 0 0}

/* feed: staff cards */
.feed{display:flex;flex-direction:column;gap:10px}
.post{background:var(--surface);border:2px solid #070a12;box-shadow:var(--hard);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:22px;height:22px;border-radius:2px}
.who b{color:var(--ink)}
.post p{margin:0;overflow-wrap:anywhere}
.stars{color:var(--yellow);letter-spacing:1px}
.skip{font-family:var(--px);font-size:10px;letter-spacing:.04em;background:var(--yellow);color:var(--yellow-ink);padding:3px 6px;align-self:flex-start;text-transform:uppercase}
.row{display:flex;gap:6px;flex-wrap:wrap}

/* tape detail */
.hero{display:grid;grid-template-columns:132px 1fr;gap:18px;margin-top:14px;align-items:start}
.hero .poster .pt{display:none}
.hero h1{font-family:var(--sign);font-weight:400;font-size:32px;line-height:1;margin:2px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.hero .facts{font-family:var(--px);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.verdict{margin-top:20px;padding:12px 14px;font-family:var(--sign);font-size:17px;letter-spacing:.01em;border:2px solid #05070d;box-shadow:var(--hard);transform:rotate(-.6deg)}
.verdict.clear{background:var(--green);color:var(--green-ink)}
.verdict.warn{background:var(--red);color:var(--red-ink)}
.verdict.unk{background:var(--surface);color:var(--muted)}
.summary{font-size:15px;color:var(--ink);margin:14px 0 0;max-width:62ch}
.advisory{margin-top:4px;background:var(--paper);color:var(--paper-ink);border:2px solid #05070d;box-shadow:var(--hard)}
.advisory .head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper-ink);color:var(--paper);padding:7px 12px;font-family:var(--px);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.wlist{display:flex;flex-direction:column}
.wcard{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:12px 12px;border-bottom:1px solid var(--paper-line)}
.wcard::before{content:"";width:12px;height:12px;background:var(--red);margin-top:4px;box-shadow:1px 1px 0 #000}
.wcard.mine{background:#fbe2d6}
.wcard .wt{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.wcard b{font-size:16px}
.wcard p{margin:2px 0 0;font-size:14px;color:#4a4236}
.wcard .ws{font-family:var(--px);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#7d715c;margin-top:4px;display:block}
.wcard .tag{font-family:var(--px);font-size:9px;letter-spacing:.05em;text-transform:uppercase;background:var(--red);color:var(--red-ink);padding:2px 5px}
.advisory .clearrow{padding:12px;display:flex;flex-direction:column;gap:8px}
.advisory .clearrow .lbl{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7d715c}
.nope{font-size:13px;font-weight:700;color:#1b6b47;background:#d6f2e4;padding:2px 7px}
.advisory details{padding:0 12px 12px}.advisory summary{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7d715c;cursor:pointer;padding:6px 0}
.advisory .badge.unk{border-color:#a99d84;color:#6e6350}
.advisory .empty{background:transparent;border:0;color:#4a4236}.advisory .empty b{color:var(--paper-ink)}
.feelbars{display:flex;flex-direction:column;gap:7px}
.feelbars div{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.feelbars span.b{height:10px;background:repeating-linear-gradient(90deg,var(--yellow) 0 8px,#c99f1c 8px 10px)}
.feelbars em{font-style:normal;color:var(--muted);font-family:var(--px);font-size:11px;text-align:right}

/* receipt-style sheets */
.sheet-back{position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--paper-ink);width:100%;max-width:640px;max-height:92%;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border-top:2px solid #05070d;
  -webkit-mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) 50% 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 0,#0000 98%,#000) 50% 0/14px 100% repeat-x;padding-top:26px}
.sheet h3{font-family:var(--sign);font-weight:400;font-size:24px;margin:0 0 4px;line-height:1}
.sheet .sub{color:#6e6350}
.field{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lbl{font-family:var(--px);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6e6350}
.field input,.field textarea{border:0;border-bottom:2px dashed #a99d84;background:transparent;padding:8px 2px;width:100%;color:var(--paper-ink);font-size:16px}
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--paper-ink)}
.field textarea{min-height:76px;resize:vertical}
.sheet .chip{background:#fffaf0;color:var(--paper-ink);border-color:var(--paper-ink);box-shadow:none}
.sheet .chip[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:30px;line-height:1;color:#cfc2a5;padding:2px}
.rate button.on{color:#d99a00}
.trig{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-line)}
.trig span{min-width:0}
.seg{display:inline-flex;border:2px solid var(--paper-ink);flex-shrink:0}
.seg button{border:0;background:#fffaf0;padding:5px 11px;font-family:var(--px);font-size:11px;color:var(--paper-ink)}
.seg button+button{border-left:2px solid var(--paper-ink)}
.seg button[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
details summary{cursor:pointer}
.sheet details summary{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:10px 0;color:#6e6350}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;position:sticky;bottom:-24px;background:var(--paper);padding:10px 0}
.sheet .btn.ghost{background:#fffaf0;color:var(--paper-ink)}
.sheet p#r-err{color:#b3260b}

/* diary */
.diary-item{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--surface);border:2px solid #070a12;box-shadow:var(--hard);padding:10px;align-items:start}
.diary-item .poster{padding:4px 4px 4px 9px;box-shadow:2px 2px 0 #05070d}
.diary-item .poster::before{width:5px}
.diary-item .poster .pt,.diary-item .poster .py{display:none}
.diary-item > div{min-width:0;display:flex;flex-direction:column;gap:5px}
.diary-item .ttl{background:none;border:0;padding:0;text-align:left;font-family:var(--sign);font-size:17px;line-height:1.05;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface);border:2px solid #070a12;box-shadow:var(--hard);padding:12px;min-width:0}
.stats b{display:block;font-family:var(--sign);font-weight:400;font-size:28px;line-height:1;color:var(--yellow);overflow-wrap:anywhere}
.stats span{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* membership card: triggers */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.trow{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:2px solid #070a12;padding:10px 12px;color:var(--ink)}
.trow b{display:block;font-size:15px}.trow small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.trow .tick{width:20px;height:20px;border:2px solid var(--dim);display:grid;place-items:center;font-family:var(--px);font-size:12px;margin-top:1px}
.trow[aria-pressed="true"]{background:var(--raise);border-color:var(--red);box-shadow:3px 3px 0 #7a1405}
.trow[aria-pressed="true"] .tick{background:var(--red);border-color:var(--red);color:var(--red-ink)}

.empty{text-align:center;padding:26px 16px;color:var(--muted);background:var(--shelf);border:2px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-family:var(--sign);font-weight:400;font-size:17px;margin-bottom:4px}
.tally{width:100%}.tally .bar{height:12px;background:var(--shelf);border:2px solid #05070d;overflow:hidden}.tally .bar i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--yellow);color:var(--yellow-ink);border:2px solid #05070d;box-shadow:var(--hard);padding:9px 14px;font-family:var(--px);font-size:11px;letter-spacing:.05em;text-transform:uppercase;z-index:30}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}.hero{grid-template-columns:104px 1fr;gap:14px}.hero h1{font-size:26px}.logo{font-size:24px}.hours{font-size:9px}}

/* readability pass: pixel font only for small decoration, real text in the body face */
.poster::after{background:linear-gradient(180deg,rgba(0,0,0,.15),transparent 30%)}
.poster{justify-content:flex-start}
.card{gap:6px}
.card .ct{font-family:var(--body);font-weight:700;font-size:15px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.card .meta{font-size:13px;color:var(--muted);margin-top:-2px}
.sticker{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none;line-height:1.2;padding:5px 8px;transform:rotate(2deg);right:-5px;top:auto;bottom:10px}
.chip{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;padding:6px 12px}
.chip.small{font-size:12px;font-weight:700;padding:4px 9px}
.search label{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.04em}
.search input{font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;text-shadow:none}
.count{font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none}
.btn{font-family:var(--body);font-size:14px;letter-spacing:.01em;text-transform:none;padding:10px 18px}
.back{font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:0;text-transform:none}
.hero h1{font-family:var(--body);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.hero .facts{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none}
.verdict{font-family:var(--body);font-weight:700;font-size:18px;transform:none}
.badge{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none}
.wcard .ws,.wcard .tag{font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none}
.wcard .tag{font-weight:700}
.advisory .clearrow .lbl,.advisory summary{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none}
.skip{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none}

    return a.n||S.ai[tid]?{cls:"clear",text:"No warnings found"}:{cls:"unk",text:"Not checked yet"};}
  const hits=[],unknown=[];
  avoid.forEach(k=>{const p=present(tid,k,a);if(p==="yes"||p==="ai-yes")hits.push(k);else if(p==="unknown")unknown.push(k)});
  if(hits.length)return {cls:"warn",text:"Heads up: "+TLABEL[hits[0]]+(hits.length>1?" +"+(hits.length-1):""),short:TLABEL[hits[0]]+(hits.length>1?" +"+(hits.length-1):""),hits};
  if(unknown.length===avoid.length)return {cls:"unk",text:"Not checked yet"};
  if(unknown.length){const ok=avoid.filter(k=>!unknown.includes(k));const okTxt=ok.includes("dog")?"The dog is fine":"No "+TLABEL[ok[0]].replace(/^An? /,"").toLowerCase();
    return {cls:"part",text:okTxt+". "+unknown.length+" of your triggers not confirmed.",short:okTxt}}
  return {cls:"clear",text:"Clear for you",short:"All clear"};
}

async function runAI(tid,manual){
  if(S.aiBusy[tid]||S.ai[tid])return;
  if(!S.session){if(manual)openAuth("Sign in to check this movie's warnings.");return}
  const t=title(tid);S.aiBusy[tid]=true;if(S.view==="title"&&S.tid===tid)render();
  try{const {data,error}=await sb.functions.invoke("fw-ai",{body:{mode:"check",title_id:tid,name:t.name,year:String(t.year||""),genre:t.genre||""}});
    if(error){let code="";try{code=(await error.context.json()).error}catch(e){}throw new Error(code||"failed")}
    if(data&&data.ok){S.aiTitles[tid]={flags:data.flags||{},summary:data.summary||""};mergeAI()}
    else if(data&&data.error==="not_found"&&manual)toast("We couldn't find enough about this movie");
  }catch(e){if(manual)toast(e.message==="rate_limited"?"You've hit today's check limit":"The check didn't come through. Try again later")}
  finally{S.aiBusy[tid]=false;if(!draft)render()}
}

/* Accounts */
function accountBlock(){
  if(!S.session)return `<h2 class="sec">Account</h2><p class="sub">Sign in to keep your diary, sync your triggers across devices, and request movies.</p><div class="actions"><button class="btn" data-act="account">Sign in or create account</button></div>`;
  return `<h2 class="sec">Account</h2><div class="post"><div class="row" style="justify-content:space-between;align-items:center"><span><b>${esc(S.displayName||"Your account")}</b><br><span class="date">${esc(S.email)}</span></span><button class="btn ghost" data-act="signout">Sign out</button></div><p class="sub" style="margin:0">Your display name and diary are visible to other people using Fair Warning.</p></div>`;

function openAuth(msg,mode){
  draft=null;const m=mode||"in";
  $("#sheet").innerHTML=`<div class="sheet-back" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Sign in">
    <h3>${m==="up"?"Create your account":"Sign in"}</h3><p class="sub">${esc(msg||"Keep your diary and triggers in sync across devices.")}</p>
    <form id="authf" novalidate>
    ${m==="up"?`<div class="field"><label for="a-name">Display name</label><input id="a-name" maxlength="40" autocomplete="nickname" placeholder="How others see you"></div>`:""}
    <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" minlength="8" autocomplete="${m==="up"?"new-password":"current-password"}" required></div>
    <p class="sub" id="a-err" hidden></p>
    <div class="sheet-foot" style="justify-content:space-between"><button type="button" class="linkish" data-auth="${m==="up"?"in":"up"}">${m==="up"?"I have an account":"Create an account"}</button><button class="btn" type="submit">${m==="up"?"Create account":"Sign in"}</button></div>
    </form></div></div>`;
  const f=$("#authf");f.addEventListener("submit",async ev=>{ev.preventDefault();const em=$("#a-email").value.trim(),pw=$("#a-pass").value,er=$("#a-err");const say=t=>{er.hidden=false;er.textContent=t};
    if(!/^\S+@\S+\.\S+$/.test(em))return say("Enter a valid email address.");if(pw.length<8)return say("Use at least 8 characters for your password.");
    const b=f.querySelector('button[type="submit"]');b.disabled=true;
    try{if(m==="up"){const nm=($("#a-name").value||"").trim().slice(0,40);
        const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:nm},emailRedirectTo:location.origin+location.pathname}});
        if(error)return say(error.message);
        if(!data.session){$("#sheet").innerHTML="";toast("Check your email to confirm your account");return}
      }else{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return say(error.message==="Invalid login credentials"?"That email and password don't match.":error.message)}
      $("#sheet").innerHTML="";toast("Signed in");
    }finally{b.disabled=false}});
  setTimeout(()=>{const i=$("#a-email");if(i)i.focus()},50);

/* Data loading */
async function loadStatic(){
  const [c,w]=await Promise.all([fetch("data/catalog.json").then(r=>r.json()),fetch("data/warnings.json").then(r=>r.json())]);
  const x={};for(const it of c.items)x[it[0]]={id:it[0],name:it[1],year:it[2]||"",genre:it[3]||"",art:it[4]||"",rank:it[5]??-1};S.cat=x;
  const b={};for(const [id,v] of Object.entries(w.items))b[id]={flags:v.f||{},summary:v.s||""};S.aiBulk=b;mergeAI();
}
async function loadTitles(){
  if(!sb)return;
  const [t,w]=await Promise.all([sb.from("fw_titles").select("id,name,year,genre,art,rank").limit(5000),sb.from("fw_warnings").select("title_id,flags,summary").limit(10000)]);
  if(!t.error){const x={};for(const r of t.data){x[r.id]={id:r.id,name:r.name,year:r.year||"",genre:r.genre||"Drama",...(r.art?{art:r.art}:{})}}S.extra=x}
  if(!w.error){const a={};for(const r of w.data)a[r.title_id]={flags:r.flags||{},summary:r.summary||""};S.aiTitles=a;mergeAI()}
}
async function loadLogs(){
  if(!sb)return;const {data,error}=await sb.from("fw_logs").select("user_id,display_name,avoid,entries,updated_at").order("updated_at",{ascending:false}).limit(500);
  if(error)return;const next={};for(const r of data)next[r.user_id]=r;S.logs=next;
  const mine=S.uid&&next[S.uid];
  if(mine&&!draft){S.starter=false;S.mine={avoid:[...(mine.avoid||[])],entries:(mine.entries||[]).map(e=>({...e,felt:[...(e.felt||[])],hits:{...(e.hits||{})}}))};if(mine.display_name)S.displayName=mine.display_name}
}
async function loadMine(){
  if(!sb||!S.session){S.myRequests=[];S.allRequests=[];return}
  const {data}=await sb.from("fw_requests").select("id,user_id,name,year,note,status,reason,title_id,created_at").order("created_at",{ascending:false}).limit(200);
  const rows=data||[];S.myRequests=rows.filter(r=>r.user_id===S.uid);S.allRequests=S.isOwner?rows:[];
  if(S.isOwner){const since=new Date(Date.now()-864e5).toISOString();const {count}=await sb.from("fw_ai_calls").select("id",{count:"exact",head:true}).gte("created_at",since);S.audit={day:count||0}}
}
async function onSession(session){
  S.session=session||null;S.uid=session?session.user.id:null;S.email=session?session.user.email:"";S.live=!!session;
  S.displayName=session?((session.user.user_metadata&&session.user.user_metadata.display_name)||S.displayName||""):"";
  const b=$("#acct");if(b)b.textContent=session?(S.displayName||"Account"):"Sign in";
  S.isOwner=false;
  if(session){try{const {data}=await sb.rpc("fw_is_admin");S.isOwner=!!data}catch(e){}
    await loadLogs();
    if(!S.logs[S.uid]){try{const local=JSON.parse(localStorage.getItem("fw_avoid")||"null");if(Array.isArray(local))S.mine.avoid=local}catch(e){}persist()}
  }
  await loadMine();if(!draft)render();
}

    const s=w>11?6:7,x=gi?Math.max(W-w*s-10,104):10;shadowE(x,w*s,G);sil(p,x,G,s,silCol,gi===1);gi++;
  }
  if(person){const wide=["couple","family","teens"].includes(person);const pw=wide?92:30;let cx=wide?100-pw/2:(gi===0?84:gi===1?120:86);
    const base=floatAll&&setting!=="sky"?220:G;const S=6,ad=(x,kind="ADULT")=>{shadowE(x,5*S,base);sil(kind,x,base,S,silCol,false)},kid=(x)=>{shadowE(x,5*S,base);sil("KID",x,base,S*.9,silCol,false)};
    const hat=(x,col,wide2)=>{rect(x-(wide2?9:3),base-11*S-2,5*S+(wide2?18:6),4,col);rect(x+4,base-11*S-12,5*S-8,11,col)};
    switch(person){
      case "couple":ad(cx);ad(cx+40,"WOMAN");sil("heart",cx+26,base-11*S-8,4,C([355,75,55]),false,false);break;
      case "family":ad(cx);ad(cx+62,"WOMAN");kid(cx+32);break;
      case "teens":kid(cx);kid(cx+32);kid(cx+64);break;
      case "kid":kid(cx);if(r()<.5)kid(cx+34);break;
      case "woman":case "dancer":ad(cx,"WOMAN");break;
      case "cowboy":ad(cx);hat(cx,silCol,true);break;
      case "detective":ad(cx);hat(cx,silCol,true);break;
      case "chef":ad(cx);rect(cx+6,base-11*S-16,18,18,silCol,'rx="6"');break;
      case "soldier":ad(cx);rect(cx-2,base-11*S-3,5*S+4,10,silCol,'rx="5"');break;
      case "astronaut":ad(cx);circ(cx+15,base-11*S+10,17,silCol);circ(cx+15,base-11*S+10,10,"#7fd6f0",'opacity=".7"');break;
      case "old":ad(cx);rect(cx+5*S+4,base-40,3,40,silCol);break;
      default:ad(cx);
    }}
  if(wx==="rain")for(let i=0;i<70;i++){const x=r()*W,y=r()*H;o.push(`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x-3).toFixed(1)}" y2="${(y+12).toFixed(1)}" stroke="#cfe0ff" stroke-width=".8" opacity=".45"/>`)}
  if(wx==="snow"||setting==="snow")for(let i=0;i<50;i++)circ(r()*W,r()*H,.8+r()*1.6,"#fff",`opacity="${(.5+r()*.5).toFixed(2)}"`);
  if(wx==="fog"){grad("fog",[[0,"#e8ecf2",0],[.5,"#e8ecf2",.55],[1,"#e8ecf2",0]]);rect(0,G-80,W,110,ref("fog"))}
  // grain + vignette
  defs.push(`<filter id="${u}grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0"/></filter>`);
  rgrad("vig",[[.6,"#000",0],[1,"#000",.32]]);
  grad("haze",[[0,C(bot),0],[.55,C(bot),.0],[.8,C(bot),.16],[1,C(bot),.05]]);o.push(`<rect width="${W}" height="${H}" fill="${ref("haze")}"/>`);
  grad("soft",[[0,"#ffffff",.07],[.4,"#ffffff",0]]);o.push(`<rect width="${W}" height="${H}" fill="${ref("soft")}"/>`);
  o.push(`<rect width="${W}" height="${H}" filter="url(#${u}grain)" opacity=".12" style="mix-blend-mode:overlay"/>`);
  o.push(`<rect width="${W}" height="${H}" fill="${ref("vig")}"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs.join("")}</defs>${o.join("")}</svg>`;
}

/* Events */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button,[data-close]");if(!b)return;
  if(b.hasAttribute("data-close")&&ev.target!==b)return;
  if(b.hasAttribute("data-close")){draft=null;drawSheet();return}
  const d=b.dataset;
  if(d.tab){S.view=d.tab;S.confirmDel=null;render();window.scrollTo(0,0);return}
  if(d.open){S.tid=d.open;S.view="title";render();window.scrollTo(0,0);if(!S.ai[d.open]&&!agg(d.open).n)runAI(d.open);return}
  if(d.filter){S.filter=d.filter;S.limit=24;render();return}
  if("genre" in d){S.genre=d.genre;S.limit=24;render();return}
  if(d.act==="more"){S.limit+=24;render();return}
  if(d.avoid){S.starter=false;const k=d.avoid,i=S.mine.avoid.indexOf(k);if(i>=0)S.mine.avoid.splice(i,1);else S.mine.avoid.push(k);persist();render();return}
  if(d.rate){readDraftInputs();draft.rating=+d.rate===draft.rating?0:+d.rate;drawSheet();return}
  if(d.feel){readDraftInputs();const i=draft.felt.indexOf(d.feel);i>=0?draft.felt.splice(i,1):draft.felt.push(d.feel);drawSheet();return}
  if(d.hit){readDraftInputs();const open=b.closest("details")?.open;draft.hits[d.hit]=draft.hits[d.hit]===d.v?undefined:d.v;if(!draft.hits[d.hit])delete draft.hits[d.hit];drawSheet();if(open){const det=$("#sheet details");if(det)det.open=true}return}
  if(d.edit){const e=S.mine.entries.find(x=>x.id===d.edit);if(e)openLog(e.tid,e);return}
  if(d.del){S.confirmDel=d.del;render();return}
  if("delNo" in d){S.confirmDel=null;render();return}
  if(d.delYes){S.mine.entries=S.mine.entries.filter(x=>x.id!==d.delYes);S.confirmDel=null;persist();render();toast("Deleted from your diary");return}
  if(d.act==="log"){openLog(S.tid);return}
  if(d.act==="cancel"){draft=null;drawSheet();return}
  if(d.act==="save"&&!S.session){readDraftInputs();openAuth("Sign in to save this to your diary.");return}
  if(d.act==="save"){readDraftInputs();draft.at=draft.at||Date.now();const i=S.mine.entries.findIndex(x=>x.id===draft.id);if(i>=0)S.mine.entries[i]=draft;else S.mine.entries.push(draft);persist();draft=null;drawSheet();render();toast(S.live?"Saved to your diary":"Saved on this screen only");return}
  if(d.act==="request"){openRequest();return}
  if(d.act==="account"){if(S.session){S.view="me";render();window.scrollTo(0,0)}else openAuth();return}
  if(d.auth){openAuth("",d.auth);return}
  if(d.act==="signout"){await sb.auth.signOut();S.mine={avoid:STARTER.slice(),entries:[]};S.starter=true;toast("Signed out");return}
  if(d.act==="req-send"){sendRequest();return}
  if(d.approve){approveReq(d.approve);return}
  if(d.decline){declineReq(d.decline);return}
  if(d.preset){if(d.preset==="clear")S.mine.avoid=[];else{for(const k of PRESETS[+d.preset][1])if(!S.mine.avoid.includes(k))S.mine.avoid.push(k)}S.starter=false;persist();render();return}
  if(d.act==="ai"){runAI(S.tid,true);return}
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;S.limit=24;if(S.view!=="tonight")S.view="tonight";render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&draft){draft=null;drawSheet()}});

/* Boot */
try{const local=JSON.parse(localStorage.getItem("fw_avoid")||"null");if(Array.isArray(local)){S.mine.avoid=local;S.starter=false}}catch(e){}
render();
(async()=>{
  try{await loadStatic()}catch(e){toast("Couldn't load the catalog. Refresh to try again")}
  S.loaded=true;render();
  if(!sb)return;
  await Promise.all([loadTitles(),loadLogs()]);
  const {data:{session}}=await sb.auth.getSession();await onSession(session);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="USER_UPDATED")onSession(sess)});
  setInterval(()=>{if(document.visibilityState==="visible"&&!draft){Promise.all([loadTitles(),loadLogs(),loadMine()]).then(()=>{if(!draft)render()})}},60000);
})();
</script>
</body></html>
